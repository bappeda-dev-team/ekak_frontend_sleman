name: Commit stage

on:
  push:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Docker image
        run: docker build -t nextjs-app:${{ github.sha }} .
